[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bslquery"
version = "0.1.0"
description = "Python package for querying the biosoundslab database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }  # or your actual license
authors = [
    { name = "Alvaro Ortiz Troncoso", email = "a.ortiztroncoso@mfn.berlin" },
]
dependencies = [
    # whatever you need to connect/query, e.g.:
    # "pandas>=2.0",
    # "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
notebooks = [
    "jupyter",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/MfN-Berlin/bslquery"

[tool.setuptools.packages.find]
where = ["src"]